<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07345D">
  <title>Retour TCV Assistant</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4ED;color:#12314A;padding:24px}
    .card{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 18px 46px rgba(7,52,93,.13)}
    .spinner{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;border:5px solid #DDE8F1;border-top-color:#0B4F8A;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{margin:0 0 10px;font-size:22px;color:#07345D}
    p{margin:0 0 18px;line-height:1.45;color:#6D7F8E}
    a{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 18px;border-radius:16px;background:#0B4F8A;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner"></div>
    <h1>Retour vers TCV Assistant…</h1>
    <p id="status">La vérification est terminée. Retour à l’application en cours.</p>
    <a id="fallback" href="./" hidden>Ouvrir TCV Assistant</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const tag = params.get('tag') || 'contacts';
      const target = params.get('target') || 'web';
      const result = params.get('result') || params.get('output') || params.get('shortcutOutput') || params.get('text') || '';
      const basePath = location.pathname.replace(/callback\.html$/, '');
      const query = new URLSearchParams({ shortcut: tag });
      if (result) query.set('result', result);
      const webUrl = `${location.origin}${basePath}?${query.toString()}`;
      const chromeUrl = `googlechromes://${location.host}${basePath}?${query.toString()}`;
      const destination = target === 'chrome' ? chromeUrl : webUrl;
      const fallback = document.getElementById('fallback');
      fallback.href = destination;

      setTimeout(() => { location.replace(destination); }, 80);
      setTimeout(() => {
        document.getElementById('status').textContent = 'Le retour automatique prend un peu de temps. Tu peux ouvrir l’application manuellement.';
        fallback.hidden = false;
      }, 1800);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07345D">
  <title>Retour TCV Assistant</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4ED;color:#12314A;padding:24px}
    .card{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 18px 46px rgba(7,52,93,.13)}
    .spinner{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;border:5px solid #DDE8F1;border-top-color:#0B4F8A;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{margin:0 0 10px;font-size:22px;color:#07345D}
    p{margin:0 0 18px;line-height:1.45;color:#6D7F8E}
    a{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 18px;border-radius:16px;background:#0B4F8A;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner"></div>
    <h1>Retour vers TCV Assistant…</h1>
    <p id="status">Traitement du résultat en cours.</p>
    <a id="fallback" href="./" hidden>Ouvrir TCV Assistant</a>
  </main>
  <script>
    (() => {
      const PLAYERS_KEY = 'tcv_players_v1';
      const STATUS_KEY = 'tcv_verify_status_v1';
      const PENDING_KEY = 'tcv_pending_shortcut_v3';

      function normalizePhone(raw = '') {
        let s = String(raw).trim().replace(/[^\d+]/g, '');
        if (!s) return '';
        if (s.startsWith('0033')) s = '+33' + s.slice(4);
        if (/^33\d+$/.test(s)) s = '+' + s;
        if (/^[67]\d{8}$/.test(s)) s = '+33' + s;
        if (/^0\d{9}$/.test(s)) s = '+33' + s.slice(1);
        return s;
      }

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function saveStatus(type, message) {
        localStorage.setItem(STATUS_KEY, JSON.stringify({
          type,
          title: 'Vérification Contacts',
          message
        }));
      }

      const params = new URLSearchParams(location.search);
      const tag = params.get('tag') || 'contacts';
      const target = params.get('target') || 'web';
      const result = (params.get('result') || params.get('output') || params.get('shortcutOutput') || params.get('text') || '').trim();
      const statusEl = document.getElementById('status');
      const fallback = document.getElementById('fallback');
      const pending = readJson(PENDING_KEY, null);
      const players = readJson(PLAYERS_KEY, []);

      let found = 0;
      let missing = 0;

      if (tag === 'contacts-cancel') {
        saveStatus('warn', 'La vérification a été annulée. Aucun statut joueur n’a été modifié.');
      } else if (tag === 'contacts-error') {
        saveStatus('warn', 'Le raccourci a rencontré une erreur. Aucun statut joueur n’a été modifié.');
      } else if (tag === 'contacts') {
        if (!pending || !Array.isArray(pending.phones)) {
          saveStatus('warn', 'Le résultat a été reçu, mais la liste en attente n’a pas été retrouvée. Relance la vérification.');
        } else {
          let foundPhones = new Set();

          if (/^IDX:/i.test(result)) {
            const indices = result.slice(4)
              .split(/[\s,;|]+/)
              .map(v => parseInt(v, 10))
              .filter(v => Number.isFinite(v) && v >= 1 && v <= pending.phones.length);
            foundPhones = new Set(indices.map(i => normalizePhone(pending.phones[i - 1])).filter(Boolean));
          } else if (!result || result.toUpperCase() === 'NONE') {
            foundPhones = new Set();
          } else {
            // Compatibilité avec l'ancien raccourci qui renvoyait les numéros eux-mêmes.
            foundPhones = new Set(
              result.split(/[\n,;|]+/).map(normalizePhone).filter(Boolean)
            );
          }

          const pendingPhones = new Set(pending.phones.map(normalizePhone).filter(Boolean));
          players.forEach(player => {
            const phone = normalizePhone(player.phone);
            if (!phone || !pendingPhones.has(phone)) return;
            const exists = foundPhones.has(phone);
            player.contactStatus = exists ? 'exists' : 'missing';
            exists ? found++ : missing++;
          });

          localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
          saveStatus('success', `Vérification terminée : ${found} contact(s) trouvé(s), ${missing} à créer.`);
          statusEl.textContent = `Terminé : ${found} trouvé(s), ${missing} à créer.`;
        }
      }

      localStorage.removeItem(PENDING_KEY);

      const basePath = location.pathname.replace(/callback\.html$/, '');
      const webUrl = `${location.origin}${basePath}?shortcut=verify-done`;
      const chromeUrl = `googlechromes://${location.host}${basePath}?shortcut=verify-done`;
      const destination = target === 'chrome' ? chromeUrl : webUrl;
      fallback.href = destination;

      setTimeout(() => { location.replace(destination); }, 350);
      setTimeout(() => {
        fallback.hidden = false;
        if (!statusEl.textContent.startsWith('Terminé')) {
          statusEl.textContent = 'Le retour automatique prend un peu de temps. Tu peux ouvrir TCV Assistant manuellement.';
        }
      }, 1800);
    })();
  </script>
</body>
</html>

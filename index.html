<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07345D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TCV Assistant">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>TCV Tournament Assistant</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <div class="brand-logo-wrap"><img class="brand-logo" src="assets/tcv-logo.png" alt="Logo Tennis Club de Vitrolles"></div>
        <div class="brand-copy">
          <span class="brand-eyebrow">Tennis Club de Vitrolles</span>
          <h1>TCV Tournament Assistant</h1>
        </div>
      </div>
      <button id="installBtn" class="icon-btn" hidden aria-label="Installer l'application">＋</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Accueil</small></button>
      <button class="nav-item" data-route="players"><span>👥</span><small>Joueurs</small></button>
      <button class="nav-item" data-route="campaign"><span>🎯</span><small>Campagne</small></button>
      <button class="nav-item" data-route="contacts"><span>📇</span><small>Contacts</small></button>
      <button class="nav-item" data-route="history"><span>🕘</span><small>Historique</small></button>
    </nav>
  </div>

  <div id="shortcutOverlay" class="overlay hidden" aria-live="polite">
    <div class="overlay-card">
      <div class="spinner"></div>
      <h3 id="overlayTitle">Ouverture du raccourci…</h3>
      <p id="overlayText">Merci de patienter. Tu reviendras automatiquement dans l’application.</p>
      <button id="overlayCloseBtn" class="btn btn-secondary hidden">Fermer</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <input id="fileInput" type="file" accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
  <script src="contact-phone-fix.js"></script>
  <script src="contact-create-flow.js"></script>
</body>
</html>

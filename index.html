<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07345D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TCV Assistant">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>TCV Tournament Assistant</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/tcv-logo.png" alt="Logo Tennis Club de Vitrolles" class="brand-logo">
        <div>
          <div class="eyebrow">Tennis Club de Vitrolles</div>
          <h1>TCV Tournament Assistant</h1>
        </div>
      </div>
      <button class="icon-btn" id="installBtn" hidden aria-label="Installer l'application">＋</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-route="players" class="nav-item"><span>👥</span><small>Joueurs</small></button>
      <button data-route="campaign" class="nav-item"><span>🎯</span><small>Campagne</small></button>
      <button data-route="contacts" class="nav-item"><span>📇</span><small>Contacts</small></button>
      <button data-route="history" class="nav-item"><span>🕘</span><small>Historique</small></button>
    </nav>
  </div>

  <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
  <script src="app.js"></script>
</body>
</html>
